<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">RAW Manager product overview</title>
  <desc id="desc">Abstract dashboard showing photography business modules for clients, sessions and invoicing.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="20" x2="1480" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151411"/><stop offset="1" stop-color="#090A0B"/>
    </linearGradient>
    <linearGradient id="accent" x1="820" y1="160" x2="1450" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D99058"/><stop offset="1" stop-color="#83543A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="30" stdDeviation="45" flood-opacity=".5"/></filter>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M52 0H0V52" stroke="#FFF" stroke-opacity=".035"/></pattern>
  </defs>
